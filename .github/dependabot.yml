# Version updates, one pull request per group: npm at the root and the
# Compose files every weekday, the rest weekly. Security updates
# ignore the schedule and the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Let new releases settle before they are proposed; the shared Meldgrove
    # packages come at once, in a pull request of their own.
    cooldown:
      default-days: 7
      exclude: ["@meldgrove/*"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      meldgrove-ui:
        patterns: ["@meldgrove/*"]
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@meldgrove/*"]
        update-types: [minor, patch]
    ignore:
      # The types follow the Node.js major (engines in package.json).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports only the TypeScript versions in its peer
      # range (8.x: below 6.1), so npm refuses a newer major (ERESOLVE).
      # Upgrade TypeScript by hand once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # A new Node.js major goes together with engines in package.json.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Checked every weekday: the Meldgrove images (the updater, the backup
  # agent) come at once, in a pull request of their own. compose.yaml pins
  # the updater exactly, so a new updater reaches servers only through it.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: ["meldgrove/*"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      meldgrove-images:
        patterns: ["meldgrove/*"]
      compose-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["meldgrove/*"]
        update-types: [minor, patch]
    ignore:
      # A new PostgreSQL major also needs a data upgrade.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
